name: Run Tests on Push  # Название нашего пайплайна

on:
  push:
    branches: [ main ]   # Запускать при каждом пуше в ветку main

jobs:
  test:
    runs-on: ubuntu-latest  # Виртуальная машина на Ubuntu
    steps:
      - name: Checkout code
        uses: actions/checkout@v4  # Загружает твой код из репозитория

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3  # Настраивает Docker

      - name: Build Docker image
        run: docker build -t my-qa-tests .  # Собирает образ

      - name: Run tests in container
        run: docker run --rm my-qa-tests  # Запускает все тесты
